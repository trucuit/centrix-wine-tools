"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"0c4a06de-6e2d-4e71-8dbd-a850a68aa174\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<style>\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  :root{\n    --bg:#eef1f5; --surface:#ffffff; --surface-2:#f7f9fc; --surface-3:#eef2f7;\n    --border:#e6e9ee; --border-soft:#eef1f5; --field-bg:#ffffff; --field-border:#d8dee7;\n    --text:#0f172a; --text-2:#5b6677; --text-3:#94a3b8; --label:#94a3b8;\n    --brand:#1e93f5; --brand-strong:#0b7bdd; --brand-soft:#eaf5fe; --brand-border:#bfe0fc;\n    --shadow:rgba(15,23,42,.06); --shadow-pop:rgba(15,23,42,.16);\n    --ok:#16a34a; --ok-text:#15803d; --ok-soft:#f0fdf4; --ok-border:#bbf7d0;\n    --danger:#dc2626; --danger-soft:#fef2f2; --danger-border:#fecaca;\n    --brand-shadow:rgba(30,147,245,.3);\n  }\n  [data-theme=\"dark\"]{\n    --bg:#0e131b; --surface:#161d28; --surface-2:#1b2330; --surface-3:#202a39;\n    --border:#28323f; --border-soft:#222b38; --field-bg:#101820; --field-border:#2d3a49;\n    --text:#e8edf5; --text-2:#9fabbd; --text-3:#6b7787; --label:#7e8b9d;\n    --brand:#33a3ff; --brand-strong:#5bb4ff; --brand-soft:rgba(51,163,255,.14); --brand-border:rgba(51,163,255,.35);\n    --shadow:rgba(0,0,0,.4); --shadow-pop:rgba(0,0,0,.55);\n    --ok:#22c55e; --ok-text:#4ade80; --ok-soft:rgba(34,197,94,.12); --ok-border:rgba(34,197,94,.32);\n    --danger:#f87171; --danger-soft:rgba(248,113,113,.12); --danger-border:rgba(248,113,113,.3);\n    --brand-shadow:rgba(51,163,255,.3);\n  }\n  input::placeholder{ color:var(--text-3); }\n  input:focus{ outline:none; }\n  @keyframes cxSpin{ to{ transform:rotate(360deg); } }\n  @keyframes cxToast{ from{ opacity:0; transform:translate(-50%,14px); } to{ opacity:1; transform:translate(-50%,0); } }\n  @keyframes cxRing{ 0%{ transform:scale(.82); opacity:.7; } 70%{ transform:scale(1.5); opacity:0; } 100%{ transform:scale(1.5); opacity:0; } }\n  @keyframes cxBlink{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }\n  @keyframes cxFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-3px); } }\n  @keyframes cxDash{ to{ stroke-dashoffset:-12; } }\n  .cx-scroll::-webkit-scrollbar{ width:9px; }\n  .cx-scroll::-webkit-scrollbar-thumb{ background:var(--field-border); border-radius:999px; border:2px solid transparent; background-clip:content-box; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-theme=\"{{ theme }}\" style=\"position:fixed;inset:0;display:flex;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--text);\">\n\n  <!-- ================= LOGIN ================= -->\n  <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ true }}\">\n    <div data-screen-label=\"Đăng nhập\" style=\"flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);\">\n      <!-- Thanh dùng chung -->\n      <div style=\"height:50px;flex-shrink:0;background:linear-gradient(180deg,#262f41,#1b212d);display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;color:#cbd3df;border-bottom:1px solid #0d121b;\">\n        <div style=\"display:flex;align-items:center;gap:16px;min-width:0;\"><div style=\"display:flex;align-items:center;gap:1px;\"><sc-for list=\"{{ menus }}\" as=\"mi\" hint-placeholder-count=\"5\"><div style=\"font-size:12.5px;font-weight:500;color:#a7b1c2;padding:5px 10px;border-radius:7px;cursor:default;\" style-hover=\"background:rgba(255,255,255,.09);color:#fff;\">{{ mi }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;\">\n          <div style=\"display:flex;align-items:center;background:rgba(255,255,255,.08);border-radius:9px;padding:3px;gap:2px;\">\n            <div onclick=\"{{ onLight }}\" style=\"font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;cursor:pointer;color:{{ segLightColor }};b ationFrame(draw); return; }\n      if (Math.abs(w - W) > 1 || Math.abs(h - H) > 1) build(w, h);\n      const isDark = this.state.theme === 'dark';\n      const lc = isDark ? '120,170,235,' : '30,147,245,';\n      for (const p of parts) { stepP(p); const d = Math.hypot(p.x - cx, p.y - cy) || 1; const minR = 30 + p.s * 0.5; if (d < minR) { p.vx += (p.x - cx) / d * 0.06; p.vy += (p.y - cy) / d * 0.06; } }\n      ctx.clearRect(0, 0, W, H);\n      const LINK = 70;\n      ctx.lineWidth = 0.6;\n      for (let i = 0; i < parts.length; i++) for (let j = i + 1; j < parts.length; j++) {\n        const a = parts[i], b = parts[j], dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;\n        if (d2 < LINK * LINK) { const al = (1 - Math.sqrt(d2) / LINK) * (isDark ? 0.15 : 0.11); ctx.strokeStyle = 'rgba(' + lc + al + ')'; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }\n      }\n      ctx.setLineDash([3, 4]); ctx.lineDashOffset = -(performance.now() / 90) % 14; ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(' + lc + (isDark ? '0.42' : '0.34') + ')';\n      for (const p of parts) if (p.link) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(p.x, p.y); ctx.stroke(); }\n      ctx.setLineDash([]);\n      for (const p of parts) {\n        const s = p.s, x = p.x - s / 2, y = p.y - s / 2, rad = Math.max(3, s * 0.26);\n        ctx.shadowColor = hexA(p.c, 0.45); ctx.shadowBlur = 7; ctx.shadowOffsetY = 2;\n        ctx.fillStyle = p.c; rr(x, y, s, s, rad); ctx.fill();\n        ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;\n        ctx.fillStyle = '#fff'; ctx.font = '800 ' + Math.round(s * 0.58) + 'px \"Segoe UI\", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n        ctx.fillText(p.ini, p.x, p.y + 0.5);\n      }\n      this._netRaf = requestAnimationFrame(draw);\n    };\n    this._netRaf = requestAnimationFrame(draw);\n  }\n  componentWillUnmount() { this._stopNet(); }\n  openService(name) {\n    this.setState({ active: name, opening
