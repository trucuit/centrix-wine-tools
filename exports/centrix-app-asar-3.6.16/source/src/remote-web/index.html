<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CentriX Claude Remote</title>
    <link rel="stylesheet" href="/remote.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <strong>Claude Remote</strong>
          <span id="statusLabel">starting</span>
        </div>
        <form id="navForm" class="address">
          <button id="backButton" type="button" title="Back">&lt;</button>
          <button id="forwardButton" type="button" title="Forward">&gt;</button>
          <button id="reloadButton" type="button" title="Reload">R</button>
          <input id="urlInput" spellcheck="false" autocomplete="off" value="https://claude.ai/login" />
          <button type="submit">Go</button>
        </form>
      </header>

      <section class="workspace">
        <section class="browser-panel">
          <div class="viewport-wrap">
            <img id="browserFrame" class="browser-frame" alt="Remote browser frame" tabindex="0" draggable="false" />
            <div id="frameHint" class="frame-hint">Click the browser image, then use keyboard or paste box.</div>
          </div>
        </section>

        <aside class="side-panel">
          <section class="panel-section">
            <label>Account</label>
            <input id="accountInput" spellcheck="false" autocomplete="off" value="default" />
            <label>Proxy rules</label>
            <input id="proxyInput" spellcheck="false" autocomplete="off" placeholder="optional, e.g. http=host:port;https=host:port" />
            <button id="openButton" type="button">Open Account</button>
          </section>

          <section class="panel-section">
            <label>Type / Paste</label>
            <textarea id="typeInput" rows="5" spellcheck="false"></textarea>
            <div class="button-row">
              <button id="typeButton" type="button">Send Text</button>
              <button id="enterButton" type="button">Enter</button>
            </div>
          </section>

          <section class="panel-section">
            <label>Viewport</label>
            <div class="size-row">
              <input id="widthInput" type="number" value="1280" min="800" max="2200" />
              <input id="heightInput" type="number" value="820" min="520" max="1600" />
            </div>
            <button id="resizeButton" type="button">Resize Browser</button>
            <div class="button-row">
              <button id="actualSizeButton" type="button">1:1 Sharp</button>
              <button id="fitWidthButton" type="button">Fit Width</button>
            </div>
          </section>

          <section class="panel-section">
            <div class="button-grid">
              <button id="showButton" type="button">Show Target</button>
              <button id="hideButton" type="button">Hide Target</button>
              <button id="devtoolsButton" type="button">DevTools</button>
            </div>
          </section>

          <section class="panel-section state">
            <div><span>Account</span><strong id="accountLabel">default</strong></div>
            <div><span>Title</span><strong id="titleLabel">-</strong></div>
            <div><span>Size</span><strong id="sizeLabel">-</strong></div>
            <div><span>Error</span><strong id="errorLabel">-</strong></div>
          </section>
        </aside>
      </section>
    </main>
    <script src="/remote.js"></script>
  </body>
</html>
