<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CentriX Shared Browser Tabs</title>
    <link rel="stylesheet" href="/remote-tabs.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <strong>Shared Browser Tab</strong>
          <span id="statusLabel">starting</span>
        </div>
        <form id="navForm" class="address">
          <button id="backButton" type="button" title="Back">&lt;</button>
          <button id="forwardButton" type="button" title="Forward">&gt;</button>
          <button id="reloadButton" type="button" title="Reload">R</button>
          <input id="urlInput" spellcheck="false" autocomplete="off" value="https://chat.zalo.me/" />
          <button type="submit">Go</button>
        </form>
      </header>

      <section class="workspace">
        <section class="browser-panel">
          <div class="viewport-wrap">
            <img id="browserFrame" class="browser-frame" alt="Shared browser tab frame" tabindex="0" draggable="false" />
            <div id="frameHint" class="frame-hint">Click the frame, then use keyboard or paste box.</div>
          </div>
        </section>

        <aside class="side-panel">
          <section class="panel-section server-info">
            <label>Server login</label>
            <div><span>Local</span><strong id="localUrlLabel">-</strong></div>
            <div><span>LAN</span><strong id="lanUrlLabel">-</strong></div>
            <div><span>Token</span><strong id="tokenLabel">-</strong></div>
          </section>

          <section class="panel-section service-manager">
            <label>User services</label>
            <div id="serverServiceList" class="server-service-list"></div>
            <input id="serviceNameInput" spellcheck="false" autocomplete="off" placeholder="Service name" />
            <input id="serviceUrlInput" spellcheck="false" autocomplete="off" placeholder="https://example.com/" />
            <input id="serviceIconInput" spellcheck="false" autocomplete="off" placeholder="Icon URL optional" />
            <label class="check-row">
              <input id="serviceEnabledInput" type="checkbox" checked />
              <span>Enabled for User app</span>
            </label>
            <div class="button-row">
              <button id="serviceNewButton" type="button">New</button>
              <button id="serviceSaveButton" type="button">Save</button>
            </div>
            <div class="button-row">
              <button id="serviceDeleteButton" type="button">Delete</button>
              <button id="serviceResetButton" type="button">Reset</button>
            </div>
            <div id="serviceStatus" class="mini-status"></div>
          </section>

          <section class="panel-section">
            <label>Tab</label>
            <input id="tabInput" spellcheck="false" autocomplete="off" value="tab-a" />
            <label>Shared profile</label>
            <input id="profileInput" spellcheck="false" autocomplete="off" value="default" />
            <label>Proxy rules</label>
            <input id="proxyInput" spellcheck="false" autocomplete="off" placeholder="optional, e.g. http=host:port;https=host:port" />
            <button id="openButton" type="button">Open Tab</button>
            <div class="quick-tabs">
              <a id="tabALink" href="/?tabId=tab-a">Tab A</a>
              <a id="tabBLink" href="/?tabId=tab-b">Tab B</a>
            </div>
          </section>

          <section class="panel-section">
            <label>Type / Paste</label>
            <textarea id="typeInput" rows="5" spellcheck="false"></textarea>
            <div class="button-row">
              <button id="typeButton" type="button">Send Text</button>
              <button id="enterButton" type="button">Enter</button>
            </div>
          </section>

          <section class="panel-section">
            <label>Viewport</label>
            <div class="size-row">
              <input id="widthInput" type="number" value="1280" min="800" max="2200" />
              <input id="heightInput" type="number" value="820" min="520" max="1600" />
            </div>
            <button id="resizeButton" type="button">Resize Tab</button>
            <div class="button-row">
              <button id="actualSizeButton" type="button">1:1 Sharp</button>
              <button id="fitWidthButton" type="button">Fit Width</button>
            </div>
          </section>

          <section class="panel-section">
            <div class="button-grid">
              <button id="showButton" type="button">Show Native</button>
              <button id="hideButton" type="button">Hide Native</button>
              <button id="devtoolsButton" type="button">DevTools</button>
              <button id="closeButton" type="button">Close Tab</button>
            </div>
          </section>

          <section class="panel-section state">
            <div><span>Tab</span><strong id="tabLabel">tab-a</strong></div>
            <div><span>Profile</span><strong id="profileLabel">default</strong></div>
            <div><span>Partition</span><strong id="partitionLabel">-</strong></div>
            <div><span>Title</span><strong id="titleLabel">-</strong></div>
            <div><span>Size</span><strong id="sizeLabel">-</strong></div>
            <div><span>Error</span><strong id="errorLabel">-</strong></div>
          </section>
        </aside>
      </section>
    </main>
    <script src="/remote-tabs.js"></script>
  </body>
</html>
