<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CentriX Embedded Browser POC</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="chromeless">
    <main class="shell">
      <section class="toolbar" aria-label="Browser controls">
        <div class="nav">
          <button id="backButton" title="Back" type="button">&lt;</button>
          <button id="forwardButton" title="Forward" type="button">&gt;</button>
          <button id="reloadButton" title="Reload" type="button">R</button>
        </div>
        <form id="urlForm" class="address">
          <input id="urlInput" spellcheck="false" autocomplete="off" value="https://claude.ai/login" />
          <button type="submit">Go</button>
        </form>
        <div class="account">
          <input id="accountInput" spellcheck="false" autocomplete="off" value="default" title="Account ID" />
          <input id="proxyInput" spellcheck="false" autocomplete="off" placeholder="proxy, optional" title="Proxy rules" />
          <button id="openAccountButton" type="button">Open</button>
        </div>
        <div class="tools">
          <button id="screenshotButton" type="button">Shot</button>
          <button id="devtoolsButton" type="button">DevTools</button>
        </div>
      </section>
      <section class="status" aria-label="Browser status">
        <div class="status-item">
          <span>View</span>
          <strong id="viewType">-</strong>
        </div>
        <div class="status-item">
          <span>Account</span>
          <strong id="accountLabel">default</strong>
        </div>
        <div class="status-item grow">
          <span>Title</span>
          <strong id="titleLabel">-</strong>
        </div>
        <div class="status-item">
          <span>Loading</span>
          <strong id="loadingLabel">no</strong>
        </div>
      </section>
    </main>
    <aside class="log" aria-label="Network log">
      <div class="log-header">
        <span>Network</span>
        <button id="clearLogButton" type="button">Clear</button>
      </div>
      <ol id="networkLog"></ol>
    </aside>
    <script src="./renderer.js"></script>
  </body>
</html>
